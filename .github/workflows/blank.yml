name: Build WebCraft APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find Android project folder
        id: project
        shell: bash
        run: |
          SETTINGS_FILE="$(find . -type f | grep -E '/settings\.gradle(\.kts)?$' | head -n 1 || true)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle(.kts) tidak ditemukan. Pastikan source project ikut di-upload ke repository." >&2
            echo "Isi repository:" >&2
            find . -maxdepth 4 -type f | sort >&2
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "Project Gradle ditemukan di: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebCraft-debug-apk
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
