name: Build HTML Maker APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Find Android project folder
        shell: bash
        run: |
          SETTINGS_FILE="$(find . -maxdepth 7 -type f -name settings.gradle -not -path '*/.gradle/*' -print -quit)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::settings.gradle tidak ditemukan. Pastikan seluruh isi proyek HTML Maker sudah diunggah ke repository."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project ditemukan di: $PROJECT_DIR"

      - name: Install Gradle 8.9
        shell: bash
        run: |
          GRADLE_VERSION="8.9"
          GRADLE_ZIP="$RUNNER_TEMP/gradle-${GRADLE_VERSION}-bin.zip"
          curl -fL --retry 3 --retry-delay 2 \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
            -o "$GRADLE_ZIP"
          unzip -q "$GRADLE_ZIP" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Build APK
        shell: bash
        run: gradle --no-daemon -p "$PROJECT_DIR" clean assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HTML-Maker-debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
